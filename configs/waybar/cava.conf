# ~/.config/waybar/cava.conf
# Minimal cava config for waybar visualizer module (12 bars)

[general]
# Number of bars shown in the bar. Matches the script's NBARS.
bars = 18
# Lower framerate keeps CPU usage modest on a laptop.
framerate = 60
# Lower sensitivity end so quiet passages still register a little.
autosens = 1
overshoot = 0

[input]
# PipeWire on Omarchy exposes a pulse-compatible source.
method = pulse
source = auto

[output]
# Send raw ASCII numbers to stdout; the script maps them to block chars.
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
# One value per bar, separated by ';', newline terminates a frame.
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
# Gentle smoothing so bars move fluidly without jitter.
noise_reduction = 0.65
